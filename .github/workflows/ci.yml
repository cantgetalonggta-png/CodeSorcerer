name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-min.txt
          pip install pytest

      - name: Core tests
        run: python tests/test_core.py

      - name: Security and ontology tests
        run: python tests/test_security_ontology.py

      - name: Purple team suite
        run: python -m security.purple_team

      - name: Basic example smoke
        run: python -m examples.basic_loop

      - name: Swarm demo smoke
        run: python -m examples.swarm_demo
